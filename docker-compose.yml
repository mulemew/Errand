services:
    # ── PostgreSQL ────────────────────────────────────────────────
    db:
      image: postgres:16-alpine
      environment:
        POSTGRES_USER: autoops
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
        POSTGRES_DB: autoops
      volumes:
        - pgdata:/var/lib/postgresql/data
      # No host port. The app reaches it over the compose network; publishing 5432 put a
      # database holding encrypted credentials on the public internet of any host without a
      # firewall, with POSTGRES_PASSWORD defaulting to "changeme". Use
      # `docker compose exec db psql` when you need a shell on it.
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U autoops -d autoops"]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 120s
      restart: unless-stopped

    # ── Browserless (remote Chrome via CDP WebSocket) ─────────────
    browserless:
      image: ghcr.io/browserless/chromium:latest
      environment:
        CONNECTION_TIMEOUT: "60000"
        MAX_CONCURRENT_SESSIONS: "5"
        DEFAULT_LAUNCH_ARGS: '["--disable-blink-features=AutomationControlled"]'
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://localhost:3000/json/version || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 6
        start_period: 30s
      restart: unless-stopped

    # ── SeleniumBase provider (undetected-chromedriver — Cloudflare bypass) ──
    # Runs Chrome in headed mode (Xvfb virtual display) via undetected-chromedriver.
    # Exposes a REST API on port 7317 for the app to create/manage browser sessions
    # that transparently bypass Cloudflare JS challenges and Turnstile.
    # Usage: add it on the Providers page (or mark it the default there) and tasks use it.
    provider-seleniumbase:
      build:
        context: artifacts/cf-proxy
        dockerfile: Dockerfile
      environment:
        PORT: "7317"
        CF_RECONNECT_TIME: "${CF_RECONNECT_TIME:-4}"
        SESSION_TIMEOUT_S: "${SESSION_TIMEOUT_S:-1800}"
        POOL_SIZE: "${POOL_SIZE:-1}"
        WHISPER_MODEL: "${WHISPER_MODEL:-small}"
        STT_ENGINE: "${STT_ENGINE:-whisper}"
      shm_size: 2g
      networks:
        default:
          # Old service name kept as an alias: providers saved in the database store an
          # instance URL, and existing rows still say http://cf-proxy:7317. Without this
          # the rename would silently break every task using a saved SeleniumBase provider.
          aliases:
            - cf-proxy
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://localhost:7317/health || exit 1"]
        interval: 15s
        timeout: 10s
        retries: 5
        start_period: 60s
      restart: unless-stopped

    # ── Camoufox provider (anti-detect Firefox) — independent of the SeleniumBase one.
    # Pick the Camoufox provider on the Providers page (or in a task) to use it.
    provider-camoufox:
      build:
        context: artifacts/camoufox-proxy
        dockerfile: Dockerfile
      environment:
        PORT: "7318"
        # 有头(默认,渲染在容器 Xvfb :99);true=无头。launch_server 的 headless 只收 bool。
        CAMOUFOX_HEADLESS: "${CAMOUFOX_HEADLESS:-false}"
        # The live view is on by default and needs nothing configured: it is never published
        # as a port — the app proxies it on its own origin, behind the same login — so it
        # stays inside the docker network. Set VNC_DISABLE=1 to turn it off entirely.
        VNC_DISABLE: "${VNC_DISABLE:-0}"
      shm_size: 2g
      networks:
        default:
          # See the alias note on provider-seleniumbase — saved providers point at the old name.
          aliases:
            - camoufox-proxy
      healthcheck:
        test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:7318/health')\" || exit 1"]
        interval: 15s
        timeout: 10s
        retries: 5
        start_period: 60s
      restart: unless-stopped

    # ── App (API + Web UI) ────────────────────────────────────────
    # Runs DB migrations automatically on startup (CREATE TABLE IF NOT EXISTS).
    # Switching databases? Just update DATABASE_URL and restart — tables are
    # created on first connect, no separate migration step needed.
    app:
      image: ghcr.io/mulemew/errand:latest
      # Long enough for stopAllInstances to dump every open browser's cookies before the
      # kernel takes over. Docker's default is 10s and one dump alone is allowed 15s, so a
      # deploy could SIGKILL the app mid-save — a hand-driven browser that was open at that
      # moment lost its session, and under the old code lost its row with it.
      stop_grace_period: 45s
      build:
        context: .
        dockerfile: Dockerfile
      environment:
        DATABASE_URL: ${DATABASE_URL:-postgresql://autoops:${POSTGRES_PASSWORD:-changeme}@db:5432/autoops}
        PORT: "8080"
        NODE_ENV: production
        DATA_DIR: /app/data
        SESSION_SECRET: ${SESSION_SECRET:-}
        ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
        DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
        # Sidecar addresses. Only needed if you move a sidecar elsewhere — the browser
        # backend a task actually uses comes from the Providers page, not from here.
        BROWSERLESS_URL: "${BROWSERLESS_URL:-ws://browserless:3000}"
        CF_PROXY_URL: "${CF_PROXY_URL:-http://provider-seleniumbase:7317}"
        CAMOUFOX_URL: "${CAMOUFOX_URL:-http://provider-camoufox:7318}"
        # Starting level only; Settings -> Log level changes it live and takes precedence.
        LOG_LEVEL: "${LOG_LEVEL:-info}"
        # Optional fallbacks for the reCAPTCHA audio solver. Normally set in Settings ->
        # Captcha instead; a value there wins over these.
        WIT_AI_TOKEN: "${WIT_AI_TOKEN:-}"
        RECAPTCHA_STT_ORDER: "${RECAPTCHA_STT_ORDER:-}"
      ports:
        - "${PORT:-80}:8080"
      volumes:
        - autoops_data:/app/data
      depends_on:
        db:
          condition: service_healthy
        browserless:
          condition: service_healthy
        provider-seleniumbase:
          condition: service_healthy
      restart: unless-stopped


volumes:
  pgdata:
  autoops_data:
